# ------------------------------------------------------------------------------
#  Telegram-Bot-for-X  -  local / self-hosted stack
#
#  Usage:
#    1. cp .env.example .env   (set BOT_TOKEN)
#    2. docker compose up -d --build
#    3. docker compose logs -f
# ------------------------------------------------------------------------------
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot-for-x:latest
    container_name: telegram-bot-for-x
    restart: unless-stopped

    # Reads BOT_TOKEN / PORT / DATABASE_PATH etc. from your local .env file.
    env_file:
      - .env

    environment:
      # Inside the container the DB must live on the mounted volume below.
      PORT: "8000"
      DATABASE_PATH: /app/data/bot.db

    ports:
      # host:container - used for the /health endpoint.
      - "8000:8000"

    volumes:
      # Persistent SQLite storage. This MUST be a volume, otherwise every
      # rebuild wipes every user's credentials and translation cache.
      - ./data:/app/data

    # Give the bot a moment to flush SQLite on graceful shutdown.
    stop_grace_period: 20s
